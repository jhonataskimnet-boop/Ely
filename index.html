<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Você — Uma Carta Guardada</title>
  <!-- Favicon embutido em SVG para evitar erro 404 no console -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✉️</text></svg>">
  <style>
    :root {
      --bg-desk: #161311;
      --bg-desk-glow: #2a211b;
      --paper-base: #f7f1e3;
      --paper-fold: #ede3cf;
      --paper-shadow: rgba(24, 18, 12, 0.45);
      --ink-main: #2c241e;
      --ink-soft: #5c4e43;
      --ink-faint: #8a796b;
      --ink-strike: #9e4747;
      --margin-line: rgba(196, 92, 92, 0.28);
      --rule-line: rgba(114, 134, 156, 0.22);
      --wax-red: #8e2424;
      --wax-dark: #5e1313;
      --wax-highlight: #b83b3b;
      --gold-accent: #c59b5f;
      --font-serif: "Georgia", "Palatino Linotype", "Book Antiqua", Palatino, serif;
      --font-script: "Segoe Script", "Brush Script MT", "Apple Chancery", "Comic Sans MS", cursive;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 25%, var(--bg-desk-glow) 0%, var(--bg-desk) 78%);
      color: var(--ink-main);
      font-family: var(--font-serif);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 48px;
      overflow-x: hidden;
      position: relative;
    }

    /* Poeira de luz ambiente na mesa */
    .ambient-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .ambient-dot {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(235, 200, 145, 0.22);
      animation: floatDust linear infinite;
    }

    @keyframes floatDust {
      0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
      20% { opacity: 0.7; }
      80% { opacity: 0.5; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Barra discreta no topo */
    .top-bar {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 50;
      display: flex;
      gap: 8px;
    }

    .sound-btn {
      background: rgba(255, 248, 236, 0.08);
      border: 1px solid rgba(255, 248, 236, 0.16);
      color: #dfd3c3;
      padding: 6px 12px;
      border-radius: 999px;
      font-family: var(--font-sans);
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.25s ease;
    }

    .sound-btn:hover {
      background: rgba(255, 248, 236, 0.16);
      color: #fff;
    }

    /* ==================== ATO 0: ENVELOPE ==================== */
    .stage {
      width: 100%;
      max-width: 680px;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .envelope-wrapper {
      width: 100%;
      max-width: 440px;
      margin: 20px auto;
      perspective: 1200px;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .envelope-wrapper.hidden {
      opacity: 0;
      transform: translateY(-24px) scale(0.96);
      pointer-events: none;
      position: absolute;
    }

    .envelope {
      position: relative;
      width: 100%;
      height: 290px;
      background: linear-gradient(145deg, #e7dcc6 0%, #d7c7aa 100%);
      border-radius: 6px;
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.65), inset 0 0 40px rgba(120, 95, 65, 0.16);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      border: 1px solid rgba(110, 88, 60, 0.35);
    }

    .envelope:hover {
      transform: translateY(-4px);
      box-shadow: 0 34px 70px rgba(0, 0, 0, 0.72), inset 0 0 40px rgba(120, 95, 65, 0.2);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 165px;
      background: linear-gradient(180deg, #dfd1b6 0%, #cbb896 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 3;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
    }

    .envelope.opening .envelope-flap {
      transform: rotateX(180deg);
    }

    .envelope-pocket {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #d8c8ab 0%, #e4d8c0 65%);
      clip-path: polygon(0 100%, 0 36%, 50% 72%, 100% 36%, 100% 100%);
      z-index: 2;
      border-top: 1px solid rgba(120, 95, 65, 0.2);
    }

    .envelope-front-text {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 4;
      padding: 0 20px;
    }

    .envelope-recipient {
      font-family: var(--font-script);
      font-size: 26px;
      color: #362a21;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .envelope-subtitle {
      font-size: 12.5px;
      color: #6b5a4b;
      font-style: italic;
    }

    .wax-seal {
      position: absolute;
      top: 122px;
      left: 50%;
      transform: translateX(-50%);
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, var(--wax-highlight), var(--wax-red) 55%, var(--wax-dark) 100%);
      box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.45),
        inset 0 2px 4px rgba(255, 255, 255, 0.25),
        inset 0 -3px 6px rgba(35, 5, 5, 0.6);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s ease, opacity 0.4s ease;
      border: 3px solid rgba(112, 22, 22, 0.7);
    }

    .wax-seal::before {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 215, 215, 0.28);
    }

    .wax-initial {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: bold;
      color: #f3d5d5;
      text-shadow: 0 1px 2px rgba(45, 6, 6, 0.8);
      user-select: none;
    }

    .envelope:hover .wax-seal {
      transform: translateX(-50%) scale(1.07);
    }

    .envelope.opening .wax-seal {
      opacity: 0;
      transform: translateX(-50%) scale(1.3);
    }

    .open-hint {
      margin-top: 16px;
      text-align: center;
      color: #cbbba8;
      font-family: var(--font-sans);
      font-size: 13px;
      letter-spacing: 0.4px;
      opacity: 0.85;
      animation: pulseHint 2.4s ease-in-out infinite;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    /* ==================== FOLHA DA CARTA (DOBRAS) ==================== */
    .letter-sheet {
      width: 100%;
      display: none;
      flex-direction: column;
      border-radius: 4px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      animation: letterAppear 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .letter-sheet.visible {
      display: flex;
    }

    @keyframes letterAppear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .fold-panel {
      position: relative;
      background-color: var(--paper-base);
      background-image:
        linear-gradient(90deg, transparent 46px, var(--margin-line) 46px, var(--margin-line) 47px, transparent 47px),
        repeating-linear-gradient(180deg, transparent 0px, transparent 31px, var(--rule-line) 31px, var(--rule-line) 32px);
      padding: 34px 32px 32px 64px;
      transition: all 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: top center;
    }

    .fold-panel + .fold-panel {
      border-top: 1px dashed rgba(130, 108, 82, 0.35);
      box-shadow: inset 0 14px 20px -14px rgba(58, 43, 28, 0.32);
    }

    .fold-panel.folded {
      display: none;
    }

    .fold-panel.unfolding {
      display: block;
      animation: unfoldPaper 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes unfoldPaper {
      0% {
        opacity: 0;
        transform: perspective(900px) rotateX(-38deg);
        filter: brightness(0.92);
      }
      100% {
        opacity: 1;
        transform: perspective(900px) rotateX(0deg);
        filter: brightness(1);
      }
    }

    .coffee-stain {
      position: absolute;
      top: 18px;
      right: 22px;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: 3px solid rgba(138, 96, 56, 0.11);
      box-shadow: inset 0 0 8px rgba(138, 96, 56, 0.08);
      pointer-events: none;
      transform: rotate(14deg);
    }

    .coffee-stain::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      border: 1.5px solid rgba(138, 96, 56, 0.07);
    }

    .letter-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
      font-size: 13px;
      color: var(--ink-faint);
      font-style: italic;
    }

    .fold-badge {
      font-family: var(--font-sans);
      font-style: normal;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b6f52;
      background: rgba(168, 136, 98, 0.14);
      padding: 3px 9px;
      border-radius: 4px;
    }

    .salutation {
      font-family: var(--font-script);
      font-size: 27px;
      color: var(--ink-main);
      margin-bottom: 16px;
    }

    .letter-p {
      font-size: 16.5px;
      line-height: 32px;
      color: var(--ink-main);
      margin-bottom: 16px;
    }

    .letter-p:last-of-type {
      margin-bottom: 8px;
    }

    .highlight-ink {
      background: linear-gradient(180deg, transparent 58%, rgba(212, 168, 106, 0.32) 58%);
      padding: 0 3px;
      font-weight: 600;
    }

    .draft-strike {
      color: var(--ink-strike);
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
      opacity: 0.78;
      margin-right: 4px;
    }

    .margin-note {
      margin: 14px 0 18px;
      padding: 12px 16px;
      background: rgba(232, 220, 198, 0.65);
      border-left: 3px solid var(--gold-accent);
      border-radius: 0 6px 6px 0;
      font-size: 15px;
      line-height: 1.65;
      color: var(--ink-soft);
      font-style: italic;
    }

    .vow-list {
      list-style: none;
      margin: 12px 0 18px;
    }

    .vow-list li {
      position: relative;
      padding-left: 22px;
      font-size: 16px;
      line-height: 32px;
      color: var(--ink-main);
    }

      content: "✦";
      position: absolute;
      left: 0;
      top
